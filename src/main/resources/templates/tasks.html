<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Smart Task Scheduler — Browse, search, filter, and manage all your tasks."/>
  <title>Tasks | Smart Task Scheduler</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- ══ Global Loader ══════════════════════════════════════ -->
<div id="global-loader" class="hidden">
  <div class="spinner-ring"></div>
</div>

<!-- ══ Alert Container ════════════════════════════════════ -->
<div id="alert-container"></div>

<!-- ══ Navbar ═════════════════════════════════════════════ -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html">
      <span class="brand-icon">🗓️</span> SmartTask
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="/"             data-page="index.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/tasks-page"   data-page="tasks.html">📋 Tasks</a></li>
        <li class="nav-item"><a class="nav-link" href="/schedule"     data-page="schedule.html">⚡ Schedule</a></li>
        <li class="nav-item"><a class="nav-link" href="/dependencies" data-page="dependencies.html">🔗 Dependencies</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ══ Page Content ═══════════════════════════════════════ -->
<main class="page-wrapper">
  <div class="container-fluid px-4">

    <!-- Page Header -->
    <div class="page-header d-flex align-items-start justify-content-between flex-wrap gap-2">
      <div>
        <h1>📋 All Tasks</h1>
        <p>Browse, filter, and manage all your scheduled tasks.</p>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">➕ Add Task</button>
    </div>

    <!-- Search & Filter Bar -->
    <div class="filter-bar">
      <input type="search" id="searchInput" class="form-control" placeholder="🔍 Search tasks…"
             style="max-width:280px;" oninput="applyFilters()"/>

      <select id="priorityFilter" class="form-select" style="max-width:150px;" onchange="applyFilters()">
        <option value="">All Priorities</option>
        <option value="HIGH">🔥 High</option>
        <option value="MEDIUM">⚡ Medium</option>
        <option value="LOW">🌿 Low</option>
      </select>

      <select id="statusFilter" class="form-select" style="max-width:150px;" onchange="applyFilters()">
        <option value="">All Statuses</option>
        <option value="pending">⏳ Pending</option>
        <option value="done">✅ Done</option>
      </select>

      <button class="btn btn-outline-secondary btn-sm ms-auto" onclick="clearFilters()">✕ Clear</button>
    </div>

    <!-- Results count -->
    <p class="text-muted-sm mb-2" id="resultsCount"></p>

    <!-- Task Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Description</th>
              <th>Priority</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tasksTbody">
            <tr><td colspan="7"><div class="empty-state py-4"><div class="spinner-ring mx-auto"></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!--
      M2 integration point:
      Validation error alerts (e.g. duplicate task title) from Member 2's
      GlobalExceptionHandler will appear in #alert-container via showAlert().
      Field errors will be rendered inside the modal form via showFieldErrors().
    -->

  </div>
</main>

<!-- ══ Add / Edit Task Modal ══════════════════════════════ -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="modalTaskLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTaskLabel">➕ Add New Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="fTitle" class="form-label">Title *</label>
          <input type="text" class="form-control" id="fTitle" placeholder="e.g. Review project report" maxlength="100"/>
          <div class="invalid-feedback"></div>
          <!-- M2: @NotBlank validation response displayed here -->
        </div>
        <div class="mb-3">
          <label for="fDescription" class="form-label">Description</label>
          <textarea class="form-control" id="fDescription" rows="2" placeholder="Optional details…" maxlength="500"></textarea>
          <div class="invalid-feedback"></div>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label for="fPriority" class="form-label">Priority *</label>
            <select class="form-select" id="fPriority">
              <option value="">— Select —</option>
              <option value="HIGH">🔥 High</option>
              <option value="MEDIUM">⚡ Medium</option>
              <option value="LOW">🌿 Low</option>
            </select>
            <div class="invalid-feedback"></div>
            <!-- M2: @Pattern(regexp="HIGH|MEDIUM|LOW") validation -->
          </div>
          <div class="col-6">
            <label for="fDeadline" class="form-label">Deadline</label>
            <input type="date" class="form-control" id="fDeadline"/>
            <div class="invalid-feedback"></div>
            <!-- M2: @Future deadline validation -->
          </div>
        </div>
        <div class="mt-3">
          <label for="fTaskListId" class="form-label">Task List</label>
          <select class="form-select" id="fTaskListId">
            <option value="">— Select List —</option>
          </select>
          <div class="invalid-feedback"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="handleTaskFormSubmit()">💾 Save Task</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ Footer ═════════════════════════════════════════════ -->
<footer>
  <span>Smart Task Scheduler</span> © 2026 — HDSE261 Team Project
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
  /* ── Tasks Page Logic ───────────────────────────────── */
  let _allTasks = [];

  /** Re-fetch and display tasks */
  async function refreshPage() {
    _allTasks = await loadAllTasks();
    applyFilters();
  }

  /** Apply current search + filter state and re-render table */
  function applyFilters() {
    const search = document.getElementById('searchInput')?.value || '';
    const prio   = document.getElementById('priorityFilter')?.value || '';
    const status = document.getElementById('statusFilter')?.value || '';

    let filtered = filterTasks(_allTasks, search, prio);

    // Status filter
    if (status === 'pending') filtered = filtered.filter(t => !t.completed);
    if (status === 'done')    filtered = filtered.filter(t =>  t.completed);

    // Update results count label
    const countEl = document.getElementById('resultsCount');
    if (countEl) countEl.textContent = `Showing ${filtered.length} of ${_allTasks.length} task(s)`;

    // Render with description column
    const tbody = document.getElementById('tasksTbody');
    if (!tbody) return;

    if (!filtered.length) {
      renderEmptyState(tbody.parentElement.parentElement.parentElement, '🔍', 'No tasks match your filters', 'Try clearing the search or changing the filters.');
      tbody.innerHTML = '';
      return;
    }

    tbody.innerHTML = filtered.map(t => `
      <tr>
        <td class="text-muted-sm">${t.id}</td>
        <td class="fw-600">${t.title || '—'}</td>
        <td class="text-muted-sm" style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.description || '—'}</td>
        <td>${priorityBadge(t.priority)}</td>
        <td class="text-muted-sm">${formatDate(t.deadline)}</td>
        <td>${statusBadge(t.completed)}</td>
        <td>
          <div class="action-btns">
            <button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${t.id})" title="Edit">✏️</button>
            <button class="btn btn-sm btn-outline-danger"  onclick="handleDelete(${t.id})"  title="Delete">🗑️</button>
            ${!t.completed
              ? `<button class="btn btn-sm btn-outline-success" onclick="handleComplete(${t.id})" title="Mark Done">✅</button>`
              : ''}
          </div>
        </td>
      </tr>`).join('');
  }

  function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('priorityFilter').value = '';
    document.getElementById('statusFilter').value = '';
    applyFilters();
  }

  // Init
  (async () => {
    await populateListDropdown('fTaskListId');
    await refreshPage();
  })();
</script>
</body>
</html>
